<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}vmware-harden{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-slate-900 text-white p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">vmware-harden</h1>
      <nav class="space-x-4">
        <a href="/" class="hover:underline {% if page == 'summary' %}font-semibold{% endif %}">Summary</a>
        <a href="/violations" class="hover:underline {% if page == 'violations' %}font-semibold{% endif %}">Violations</a>
        <a href="/drift" class="hover:underline {% if page == 'drift' %}font-semibold{% endif %}">Drift</a>
      </nav>
    </div>
  </header>
  <main class="container mx-auto p-6">
    {% block content %}{% endblock %}
  </main>
  <footer class="text-center text-xs text-slate-400 py-4">
    AI-native VMware compliance — M2 dashboard
  </footer>
</body>
</html>
