[project]
name = "vmware-harden"
version = "1.8.0"
description = "AI-native VMware compliance and baseline enforcement"
readme = "README.md"
license = "MIT"
authors = [{ name = "Wei Zhou", email = "wei-wz.zhou@broadcom.com" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.5,<3.0",
    "duckdb>=0.10,<2.0",
    "pyyaml>=6.0,<7.0",
    # Reserved for v1.1 MCP integration (@vmware_tool decorator + audit logging).
    "vmware-policy>=1.8.0,<2.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "httpx>=0.27,<1.0",
    "anthropic>=0.40,<1.0",
    "mcp>=1.10,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
vmware-harden = "vmware_harden.cli.main:app"
vmware-harden-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vmware_harden", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests with mocked external systems",
    "lab: Tests requiring real VMware lab environment",
]
